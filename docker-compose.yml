version: "3.8"

services:
  bot:
    build: .
    container_name: animedekho-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/app/data
      - bot-tmp:/tmp/animedekho_dl
    depends_on:
      - vidstream-api
    environment:
      - VIDSTREAM_API_URL=http://vidstream-api:4030

  vidstream-api:
    build: ./vidstream-api
    container_name: animedekho-vidstream
    restart: unless-stopped
    expose:
      - "4030"

volumes:
  bot-data:
  bot-tmp:
